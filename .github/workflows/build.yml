name: Build Windows exe

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: 安装 mingw-w64 交叉工具链
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64

      - name: 编译 picker.exe
        run: |
          export MINGW=/usr/bin
          ./build.sh --exe-only

      - name: 校验产物（确为 Windows PE 可执行文件）
        run: |
          file picker.exe
          ls -la picker.exe

      - name: 上传构建产物
        uses: actions/upload-artifact@v5
        with:
          name: picker-exe
          path: picker.exe

      - name: 挂到 Release（仅 tag 推送时）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: picker.exe
          generate_release_notes: true
